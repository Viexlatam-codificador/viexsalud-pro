backend:
  name: github
  repo: Viexlatam-codificador/viexsalud-pro
  branch: main
  base_url: https://viexsalud.cl
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "src/assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Artículo"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción (SEO)", name: "description", widget: "text", hint: "Aparece en Google y al compartir por WhatsApp. Máximo 160 caracteres." }
      - { label: "Categoría", name: "tag", widget: "string", hint: "Ej: Guía · Isapres" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Imagen de portada (opcional)", name: "cover", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
