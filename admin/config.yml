backend:
  name: github
  repo: Viexlatam-codificador/viexsalud-pro
  branch: main
  base_url: https://viexsalud.cl
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "src/assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Artículo"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción (SEO)", name: "description", widget: "text", hint: "Aparece en Google y al compartir por WhatsApp. Máximo 160 caracteres." }
      - { label: "Categoría", name: "tag", widget: "string", hint: "Ej: Guía · Isapres" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Imagen de portada (opcional)", name: "cover", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "preexistencias"
    label: "Preexistencias"
    label_singular: "Preexistencia"
    folder: "src/content/preexistencias"
    create: true
    slug: "{{slug}}"
    extension: "md"
    summary: "{{fields.nombre}} — {{fields.isapre}}"
    fields:
      - { label: "Preexistencia", name: "nombre", widget: "string", hint: "Ej: Hipertensión, Hernia lumbar, Diabetes tipo 2" }
      - { label: "Cómo declarar", name: "como_declarar", widget: "text", hint: "El texto o términos exactos que debe usar el ejecutivo para declararla correctamente." }
      - label: "Isapre"
        name: "isapre"
        widget: "relation"
        collection: "isapres"
        search_fields: ["nombre"]
        display_fields: ["nombre"]
        value_field: "nombre"
        hint: "Si no aparece la Isapre que buscas, agrégala primero en la colección 'Isapres'."

  - name: "isapres"
    label: "Isapres"
    label_singular: "Isapre"
    folder: "src/content/isapres"
    create: true
    slug: "{{slug}}"
    extension: "md"
    summary: "{{fields.nombre}}"
    fields:
      - { label: "Nombre", name: "nombre", widget: "string", hint: "Se usará igual en Preexistencias y en el Comparador de Planes." }

  - name: "settings"
    label: "Configuración del sitio"
    files:
      - name: "home"
        label: "Portada — Banner principal y testimonios"
        file: "src/_data/home.json"
        fields:
          - label: "Banner principal"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto pequeño superior", name: "eyebrow", widget: "string" }
              - { label: "Título principal", name: "title", widget: "string", hint: "Puedes usar <em>texto</em> para destacar una parte en cursiva." }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
          - label: "Testimonios"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Estrellas (1 a 5)", name: "stars", widget: "number", min: 1, max: 5, default: 5, value_type: "int" }
              - { label: "Testimonio", name: "text", widget: "text" }
              - { label: "Nombre", name: "author", widget: "string" }
              - { label: "Rol / fuente", name: "role", widget: "string", required: false }
